name: CI
on:
  pull_request:
    branches:
      - dev
      - prod
  push:
    branches:
      - dev
      - prod

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: echo "install dependencies"

      - name: Lint
        run: echo "run formatter"

      - name: Test
        run: echo "run test"

      - name: Build
        run: echo "run build"
