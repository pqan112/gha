name: Set Env
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Choose the env to deploy
        required: true
        default: dev
        type: "choice"
        options:
          - dev
          - test
          - prod

jobs:
  inputs-test:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the App
        run: echo "Deploying the application to ${{inputs.environment}}"
