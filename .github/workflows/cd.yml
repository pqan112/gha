name: CD

on:
  workflow_run:
    workflows: ["CI"] # Lắng nghe workflow có tên là "CI"
    types:
      - completed
    branches:
      - main # Chạy CD khi CI trên nhánh dev hoàn thành

jobs:
  deploy:
    name: Deploy to Develop
    runs-on: ubuntu-latest

    # Chỉ chạy deploy nếu CI thành công
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: develop

    steps:
      # Bước 1: Kéo mã nguồn về (Bắt buộc phải có để lấy file Dockerfile)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Tải thư mục build tĩnh từ luồng CI về máy ảo CD
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./dist-deploy

      # Bước 3: Xác thực với Docker Hub an toàn qua Action chính chủ
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 4: Build Image và Push
      - name: Build and Push Docker Image
        run: |
          echo "Bắt đầu đóng gói Docker Image..."

          # Đặt tên image (thay 'my-frontend-app' bằng tên dự án của bạn)
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/my-frontend-app"

          # Đặt tag (vì đây là nhánh develop nên ta đánh tag là develop)
          TAG="develop" 

          # Lệnh đóng gói Image. Dấu chấm (.) ở cuối nghĩa là dùng thư mục hiện tại làm context
          docker build -t $IMAGE_NAME:$TAG .

          echo "Đẩy Image lên Docker Hub..."
          docker push $IMAGE_NAME:$TAG
